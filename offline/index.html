    .stage {
      width: min(96vw, 960px);
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      touch-action: none;
      border: 2px solid #4a3622;
      border-radius: 4px;
      box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    /* 横屏：画布尽量占满屏幕；竖屏：画布靠上，触控区在下方 */
    @media (orientation: landscape) {
      .stage { width: min(100vw, calc(100vh * 16 / 9)); }
      .caption { display: none; }
    }
    @media (orientation: portrait) {
      body { justify-content: flex-start; padding-top: env(safe-area-inset-top); }
      .stage { width: 100vw; }
      .caption { display: none; }
    }

      text-align: center;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: #8a6b45;
    }

      max-width: min(560px, 94vw);
      width: 100%;
      padding: 4px 26px 10px;
      background:
        radial-gradient(ellipse at 18% 10%, rgba(146, 70, 28, 0.28), transparent 45%),
        radial-gradient(ellipse at 88% 92%, rgba(120, 58, 24, 0.22), transparent 48%),
        radial-gradient(ellipse at 78% 8%, rgba(0, 0, 0, 0.3), transparent 32%),
        radial-gradient(ellipse at 20% 88%, rgba(0, 0, 0, 0.22), transparent 34%),
        linear-gradient(180deg, #2b1c0e 0%, #190f07 100%);
      border: 3px solid #5a3c1f;
      box-shadow:
        0 8px 0 rgba(0, 0, 0, 0.4),
        0 16px 40px rgba(0, 0, 0, 0.6),
        inset 0 0 0 2px rgba(0, 0, 0, 0.4),
        inset 0 0 28px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .overlay .dust-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    .menu-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 3px);
      z-index: 1;
    }
    .menu-panel::after {
      content: "";
      position: absolute;
      inset: 7px;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 0 0, #cf8f4e 0 2px, #241407 2.5px 3.5px, transparent 4px),
        radial-gradient(circle at 100% 0, #cf8f4e 0 2px, #241407 2.5px 3.5px, transparent 4px),
        radial-gradient(circle at 0 100%, #cf8f4e 0 2px, #241407 2.5px 3.5px, transparent 4px),
        radial-gradient(circle at 100% 100%, #cf8f4e 0 2px, #241407 2.5px 3.5px, transparent 4px);
      background-size: 10px 10px;
      background-position: 0 0, 100% 0, 0 100%, 100% 100%;
      background-repeat: no-repeat;
    }
    .panel-hazard {
      height: 8px;
      margin: 0 -26px;
      background: repeating-linear-gradient(-45deg, #c9a227 0 8px, #0c0f0b 8px 16px);
      border-bottom: 2px solid #0c0f0b;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
    }
    .menu-panel > :not(.panel-hazard) {
      position: relative;
      z-index: 2;
    }
    .game-title {
      margin: 12px 0 2px;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 0.1em;

        0 3px 0 #7a5c00,
        0 6px 0 rgba(0, 0, 0, 0.55),

    .title-tag {

      margin: 0 0 16px;

      font-size: 15px;
      font-weight: 900;

      background: linear-gradient(180deg, #5a140b, #2c0a05);

      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.55), 0 0 14px rgba(201, 162, 39, 0.25);

    .panel-caption {

    .garage-preview {

      max-width: 560px;

    #tank-preview {

    #menu-tank-preview {

    .tier-select {

    .tier-chip {

    .cards {

    .upgrade-card {

    .upgrade-card:hover {

    .upgrade-card .icon {

    .upgrade-card .name {

    .upgrade-card .stack {

    .menu-stats {

    }
    .pix-icon {

    .menu-meta {

    .menu-meta::-webkit-scrollbar {

    }

      background: #140b05;
    }
    .menu-meta::-webkit-scrollbar-thumb {
      background: #57381f;
      border: 1px solid #140b05;
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 560px;
      max-width: 100%;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #221408;
      border: 1px solid #53381f;
      color: #e2c9a6;
      text-align: left;

      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .meta-row:hover {
      border-color: #ffb45e;
      box-shadow: 0 0 12px rgba(255, 180, 94, 0.2);
    }
    .meta-row .meta-info {
      flex: 1;
    }
    .meta-row .meta-name {
      color: #ffd65a;
      font-size: 14px;
    }
    .meta-row .meta-desc {
      font-size: 11px;
      color: #a98c6c;
      margin-top: 2px;
    }
    .meta-row .meta-lvl {
      font-size: 12px;
      color: #d9a23f;
      min-width: 56px;
      text-align: center;
    }
    .menu-btn {
      padding: 10px 26px;
      margin: 0 8px;
      background: linear-gradient(180deg, #3a2a17 0%, #1f1409 100%);
      border: 2px solid #5a3c1f;
      color: #e0c9a0;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 0 #0a0603, 0 6px 10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 220, 160, 0.08);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.7);
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s, color 0.12s, text-shadow 0.12s;
    }
    .menu-btn:hover {
      transform: translateY(-2px);
      border-color: #ffb45e;
      color: #ffdf9e;
      box-shadow: 0 6px 0 #0a0603, 0 0 18px rgba(255, 180, 94, 0.35);
      text-shadow: 0 0 8px rgba(255, 180, 94, 0.8);
    }
    .menu-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0a0603, 0 0 10px rgba(255, 180, 94, 0.2);
    }
    .menu-btn.primary {
      border-color: #c96f35;
      color: #ffd65a;
      font-size: 18px;
      padding: 12px 44px;
    }
    #start-btn {
      font-size: 22px;
      padding: 16px 64px;
      border-color: #ff9d4d;
      color: #fff0c0;
      background: linear-gradient(180deg, #a34b1f 0%, #5f2410 100%);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
      animation: startPulse 2.4s ease-in-out infinite;
    }
    @keyframes startPulse {
      0%, 100% {
        box-shadow: 0 5px 0 #0a0603, 0 0 12px rgba(255, 157, 77, 0.28);
      }
      50% {
        box-shadow: 0 5px 0 #0a0603, 0 0 30px rgba(255, 190, 80, 0.55);
      }

    .menu-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 18px;
    }
    .menu-nav .menu-btn {
      margin: 0;
    }
    .menu-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    .gameover-stats {
      color: #e0c9a0;
      font-size: 14px;
      line-height: 1.9;
      margin-bottom: 10px;
      text-align: left;
    }
    .gameover-stats b {
      color: #ffd65a;
    }
    .upgrade-stats {
      color: #d9a23f;
      font-size: 12px;
      margin: -14px 0 18px;
    }
    #qr-panel {
      display: none;
      position: fixed;
      right: 14px;
      bottom: max(72px, calc(env(safe-area-inset-bottom) + 54px));
      z-index: 30;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: linear-gradient(180deg, #2b1c0e, #1a1007);
      border: 2px solid #5a3c1f;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.45), 0 8px 18px rgba(0, 0, 0, 0.5);
      max-width: 92vw;
    }
    #qr-panel.open {
      display: flex;
    }
    .qr-dock {
      position: fixed;
      right: 14px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 15;
      padding: 8px 14px;
      background: linear-gradient(180deg, #3a2a17 0%, #1f1409 100%);
      border: 2px solid #5a3c1f;
      color: #e0c9a0;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 3px 0 #0a0d08, 0 4px 8px rgba(0, 0, 0, 0.45);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.7);
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s, color 0.12s;
    }
    .qr-dock:hover {
      border-color: #e8c93f;
      color: #ffe98a;
      box-shadow: 0 3px 0 #0a0d08, 0 0 14px rgba(232, 201, 63, 0.35);
    }
    .qr-dock:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0a0d08;
    }
    .qr-close {
      position: absolute;
      top: 4px;
      right: 6px;
      background: none;
      border: none;
      color: #a98c6c;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
    }
    .qr-close:hover {
      color: #ffb45e;
    }
    #qr-canvas {
      width: 132px;
      height: 132px;
      image-rendering: pixelated;
      background: #fff;
      flex: none;
    }
    #qr-info {
      text-align: left;
      font-size: 12px;
      color: #a98c6c;
    }
    #qr-url {
      display: block;
      color: #e0c9a0;
      word-break: break-all;
      margin: 4px 0 8px;
      font-size: 11px;
    }
    /* 触摸控件：仅触屏设备显示；摇杆/按钮尺寸由 JS 按屏幕动态调整 */
    #joy-zone {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 56vw;
      height: 62vh;
      z-index: 5;
      touch-action: none;
      display: none;
    }
    #joy-base {
      position: fixed;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      border: 2px solid rgba(201, 111, 53, 0.6);
      background: rgba(20, 12, 6, 0.45);
      display: none;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #joy-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 50px;
      height: 50px;
      margin: -25px 0 0 -25px;
      border-radius: 50%;
      background: rgba(255, 180, 94, 0.85);
      display: none;
      pointer-events: none;
    }
    #fire-btn {
      position: fixed;
      right: max(24px, env(safe-area-inset-right));
      bottom: max(36px, env(safe-area-inset-bottom));
      width: clamp(88px, 23vw, 116px);
      height: clamp(88px, 23vw, 116px);
      border-radius: 50%;
      border: 3px solid #c96f35;
      background: rgba(20, 12, 6, 0.5);
      color: #ffd65a;
      font-family: inherit;
      font-size: clamp(20px, 6vw, 26px);
      z-index: 5;
      display: none;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #rotate-hint {
      display: none;
      position: fixed;
      top: max(70px, calc(env(safe-area-inset-top) + 56px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      color: #ffd65a;
      background: rgba(15, 10, 5, 0.85);
      border: 1px solid #4a3622;
      padding: 6px 14px;
      font-size: 13px;
      max-width: 92vw;
      text-align: center;
      pointer-events: none;
    }
    /* 常驻悬浮按钮：背景音乐开关 + 横竖屏切换 */
    #music-btn,
    #volume-btn,
    #rotate-btn {
      position: fixed;
      z-index: 12;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid #4a3622;
      background: rgba(15, 10, 5, 0.85);
      color: #ffd65a;
      font-family: inherit;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.12s, transform 0.12s;
    }
    #music-btn:hover,
    #volume-btn:hover,
    #rotate-btn:hover {
      border-color: #c96f35;
      transform: scale(1.06);
    }
    #music-btn {
      right: max(14px, env(safe-area-inset-right));
      top: max(24px, calc(env(safe-area-inset-top) + 10px));
    }
    #volume-btn {
      right: max(68px, calc(env(safe-area-inset-right) + 54px));
      top: max(24px, calc(env(safe-area-inset-top) + 10px));
    }
    #rotate-btn {
      right: max(122px, calc(env(safe-area-inset-right) + 108px));
      top: max(24px, calc(env(safe-area-inset-top) + 10px));
      display: none;
    }
    /* 强制横屏兜底：无法锁屏/全屏时，把画布旋转铺满竖屏（再点 ⇄ 恢复） */
    html.forced-rotate,
    html.forced-rotate body {
      overflow: hidden;
    }
    html.forced-rotate .stage {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(calc(100vw * 16 / 9), 100vh);
      width: min(calc(100vw * 16 / 9), 100dvh);
      transform: translate(-50%, -50%) rotate(90deg);
      z-index: 4;
    }
    html.forced-rotate .stage canvas {
      border-radius: 0;
      box-shadow: 0 0 0 1px #000;
    }
    /* 音量调节面板 */
    #music-panel {
      position: fixed;
      top: max(78px, calc(env(safe-area-inset-top) + 64px));
      right: max(14px, env(safe-area-inset-right));
      width: 240px;
      z-index: 20;
      background: rgba(20, 12, 6, 0.96);
      border: 1px solid #4a3622;
      border-radius: 6px;
      padding: 12px 14px;
      color: #e0c9a0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
    }
    #music-panel.hidden { display: none; }
    .mp-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .mp-row:last-child { margin-bottom: 0; }
    .mp-label {
      font-size: 12px;
      color: #b99a76;
      min-width: 48px;
      flex: none;
    }
    .mp-btn {
      background: #241609;
      border: 1px solid #4a3622;
      color: #ffd65a;
      font-family: inherit;
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .mp-btn:hover { border-color: #c96f35; }
    #mp-volume {
      flex: 1;
      accent-color: #d9a23f;
      height: 26px;
      min-width: 0;
    }
    #mp-value {
      font-size: 12px;
      color: #ffd65a;
      min-width: 38px;
      text-align: right;
      flex: none;
    }
    @media (pointer: coarse) {
      #joy-zone { display: block; width: 60vw; height: 70vh; }
      #fire-btn { display: flex; }
      #volume-btn { display: flex; }
      #rotate-btn { display: flex; }
      .menu-btn { padding: 14px 30px; font-size: 16px; }
      .menu-btn.primary { padding: 16px 48px; font-size: 20px; }
      #start-btn { font-size: 20px; padding: 16px 40px; }
      .qr-dock, #qr-panel { display: none !important; }
      .menu-panel { padding: 4px 12px 10px; }
      .panel-hazard { margin: 0 -12px; }
      .game-title { font-size: 30px; }
      .title-tag { letter-spacing: 0.18em; }
      .menu-stats { gap: 18px; font-size: 13px; }
      .upgrade-card { width: min(280px, 84vw); padding: 24px 18px; }
      .upgrade-card .desc { min-height: 0; font-size: 13px; }
      .overlay { overflow-y: auto; padding: 24px 0; }
      .meta-row { padding: 12px 14px; }
      .menu-meta { max-height: 42vh; }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate-hint { display: block; }
      #joy-zone { width: 64vw; height: 44vh; bottom: env(safe-area-inset-bottom); }
      #fire-btn { bottom: max(24px, env(safe-area-inset-bottom)); }
    }
    @media (pointer: coarse) and (orientation: landscape) {
      #joy-zone { height: 70vh; }
    }

  <main class="stage">
    <canvas id="game" width="640" height="360"></canvas>

        if (save.tier === id) return;
        if (unlocked.indexOf(id) !== -1 || def.cost === 0) {
          if (unlocked.indexOf(id) === -1) {
            unlocked.push(id);
            save.unlocked = unlocked;
          }
          save.tier = id;
          writeSave(save);
          uiSfx.open();
        } else {
          var needWaves = (def.req && def.req.waves) || 0;
          if ((save.coins || 0) < def.cost || (save.wavesCleared || 0) < needWaves) { uiSfx.close(); return; }
          save.coins -= def.cost;
          unlocked.push(id);
          save.unlocked = unlocked;
          save.tier = id;
          writeSave(save);
          uiSfx.go();
        }
        syncGameSave();
        refreshTankPreview();
        renderTierChips();
      }
      // —— 地图选择（原野战场 / 废土之城）——
      var MAPS = [
        { id: 'original', name: '原野战场', desc: '经典原版地图 · 无天气' },
        { id: 'wasteland', name: '废土之城', desc: '废土城市 · 沙尘天气 · 可探索废墟（走进门洞，打爆废车搜刮 XP）' }
      ];
      function renderMapChips() {
        var row = document.getElementById('map-row');
        if (!row) return;
        var save = readSave() || {};
        var cur = save.map === 'wasteland' ? 'wasteland' : 'original';
        row.innerHTML = '';
        MAPS.forEach(function (def) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'tier-chip' + (cur === def.id ? ' selected' : '');
          chip.setAttribute('data-map', def.id);
          chip.title = def.desc;
          var name = document.createElement('span');
          name.className = 'tier-name';
          name.textContent = def.name;
          var cost = document.createElement('span');
          cost.className = 'tier-cost';
          cost.textContent = cur === def.id ? '使用中' : '点击切换';
          chip.appendChild(name);
          chip.appendChild(cost);
          row.appendChild(chip);
        });
      }
      function onMapClick(e) {
        var chip = e.target && e.target.closest ? e.target.closest('[data-map]') : null;
        if (!chip) return;
        var id = chip.getAttribute('data-map');
        var save = readSave() || {};
        if (save.map === id) return;
        save.map = id;
        writeSave(save);
        syncGameSave();
        uiSfx.open();
        renderMapChips();
      }
      function bindUiClick(id, fn) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('click', fn);
      }
      bindUiClick('start-btn', function () { uiSfx.click(); uiSfx.go(); });
      bindUiClick('restart-btn', function () { uiSfx.click(); uiSfx.go(); });
      bindUiClick('menu-btn', function () { uiSfx.click(); uiSfx.open(); refreshTankPreview(); });
      bindUiClick('garage-btn', function () { uiSfx.click(); uiSfx.open(); refreshTankPreview(); renderTierChips(); renderMapChips(); });
      bindUiClick('garage-close', function () { uiSfx.click(); uiSfx.close(); refreshTankPreview(); });
      bindUiClick('qr-copy', function () { uiSfx.click(); });
      bindUiClick('preview-form-btn', function () {
        uiSfx.click();
        refreshTankPreview(previewForm === 2 ? 1 : 2);
      });
      bindUiClick('qr-toggle', function () {
        uiSfx.click();
        if (qrPanel.classList.contains('open')) uiSfx.close();
        else uiSfx.open();
      });
      bindUiClick('qr-close', function () { uiSfx.click(); uiSfx.close(); });
      document.addEventListener('click', function (e) {
        if (!e.target || !e.target.closest) return;
        if (e.target.closest('[data-map]')) { onMapClick(e); return; }
        if (e.target.closest('.tier-chip')) { onTierClick(e); return; }
        if (e.target.closest('.meta-row .menu-btn') || e.target.closest('#upgrade-cards .upgrade-card')) {
          uiSfx.click();
          if (e.target.closest('.meta-row .menu-btn')) refreshTankPreview();
        }
      });
      var lastHoverEl = null;
      if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
        document.addEventListener('mouseover', function (e) {
          if (!e.target || !e.target.closest) return;
          var el = e.target.closest('.menu-btn, .qr-dock, .upgrade-card, .tier-chip');
          if (el && el !== lastHoverEl) {
            lastHoverEl = el;
            uiSfx.hover();
          }
        });
      }
      refreshTankPreview();
      renderTierChips();
      renderMapChips();
    })();
  </script>
</body>
</html>
